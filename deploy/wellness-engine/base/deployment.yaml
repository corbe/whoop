apiVersion: apps/v1
kind: Deployment
metadata:
  name: wellness-engine-api
  labels:
    app: wellness-engine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wellness-engine-api
  template:
    metadata:
      labels:
        app: wellness-engine-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
      containers:
        - name: api
          image: noana-hml/wellness-engine:dev # operator replaces with the built tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: TZ
              value: America/Sao_Paulo
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wellness-engine-secrets
                  key: DATABASE_URL
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wellness-engine-secrets
                  key: INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: wellness-engine-api
  labels:
    app: wellness-engine-api
spec:
  type: ClusterIP # internal only — shadow Phase A needs no public ingress
  selector:
    app: wellness-engine-api
  ports:
    - port: 8080
      targetPort: http
      name: http
