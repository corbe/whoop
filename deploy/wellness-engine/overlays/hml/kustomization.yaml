# HML overlay — namespace + image tag, following the noana-k8s convention
# (base + overlay). Secrets (wellness-engine-secrets, wellness-shadow-cohort)
# are operator-created (sealed secrets in noana-k8s); never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: noana-hml
resources:
  - ../../base
images:
  - name: noana-hml/wellness-engine
    newName: 525534623487.dkr.ecr.us-east-1.amazonaws.com/noana-wellness-engine
    newTag: hml-a6ab786
